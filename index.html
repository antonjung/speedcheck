<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Speed Guard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e14" />
<meta name="description" content="Shows your driving speed from GPS on a dial and announces it at an interval you choose." />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SpeedGuard" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="mainView" class="main-view">

  <div class="top-bar">
    <span class="top-bar-spacer"></span>
    <div class="top-bar-center">
      <div id="gpsInfo" class="gps-info">GPS &mdash;</div>
      <p id="statusMessage" class="status-message"></p>
    </div>
    <span class="top-bar-spacer"></span>
  </div>

  <div class="dial-wrap">
    <svg id="dial" class="dial" viewBox="0 0 200 200" aria-label="Speedometer"></svg>
    <div class="speed-readout">
      <span id="speedValue">0</span>
      <span class="unit">mph</span>
    </div>
  </div>

  <div id="testControls" class="test-controls" hidden>
    <span class="test-controls-label">Test speed</span>
    <div class="test-presets">
      <button id="testSpeedDown10" type="button" class="btn small">&minus; 10</button>
      <button id="testSpeedDown" type="button" class="btn small">&minus; 1</button>
      <button id="testSpeedUp" type="button" class="btn small">+ 1</button>
      <button id="testSpeedUp10" type="button" class="btn small">+ 10</button>
    </div>
  </div>

  <div class="controls">
    <div class="control">
      <span class="setting-label">Announce every <span class="setting-value" id="valInterval"></span></span>
      <div class="slider-box">
        <input type="range" id="setInterval" min="1" max="60" step="1" aria-label="Announce interval in seconds" />
      </div>
    </div>
    <div class="control">
      <span class="setting-label">Silent below <span class="setting-value" id="valSilent"></span></span>
      <div class="slider-box">
        <input type="range" id="setSilent" min="0" max="60" step="1" aria-label="Stay silent below this speed in mph" />
      </div>
    </div>
  </div>

  <p class="build-version" id="buildVersion"></p>

</div>

<script src="app.js"></script>
</body>
</html>

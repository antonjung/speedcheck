<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Speed Guard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e14" />
<meta name="description" content="Tracks your driving speed via GPS and warns you when you're near or over a speed limit you set." />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SpeedGuard" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="mainView" class="main-view">

  <div class="top-bar">
    <button id="settingsBtn" class="btn icon-btn" aria-label="Settings">&#9881;</button>
    <div class="top-bar-center">
      <div id="gpsInfo" class="gps-info">GPS &mdash;</div>
      <p id="statusMessage" class="status-message"></p>
    </div>
    <button id="stopBtn" class="btn icon-btn danger" aria-label="Clear speed limit">&#10006;</button>
  </div>

  <div id="statusPanel" class="status-panel" data-status="no-fix">
    <div class="speed-readout">
      <span id="speedValue">0</span>
      <span id="actualSpeed" class="actual-speed" hidden></span>
    </div>
  </div>

  <div class="manual-entry">
    <div class="speed-signs" id="speedSigns">
      <button type="button" class="speed-sign" data-limit="20">20</button>
      <button type="button" class="speed-sign" data-limit="30">30</button>
      <button type="button" class="speed-sign" data-limit="40">40</button>
      <button type="button" class="speed-sign" data-limit="50">50</button>
      <button type="button" class="speed-sign" data-limit="60">60</button>
      <button type="button" class="speed-sign" data-limit="70">70</button>
    </div>
  </div>

  <div id="testControls" class="test-controls" hidden>
    <span class="test-controls-label">Test speed</span>
    <div class="test-presets">
      <button id="testSpeedDown" type="button" class="btn small" aria-label="Decrease test speed by 1 mph">&minus; 1 mph</button>
      <button id="testSpeedUp" type="button" class="btn small" aria-label="Increase test speed by 1 mph">+ 1 mph</button>
    </div>
    <div class="test-presets">
      <button id="testPresetUnder" type="button" class="btn small">Limit &minus;5</button>
      <button id="testPresetAt" type="button" class="btn small">At limit</button>
      <button id="testPresetOver" type="button" class="btn small">Limit +5</button>
    </div>
  </div>

</div>

<div id="settingsPanel" class="settings-panel" hidden>
  <div class="settings-sheet">
    <h2>Settings</h2>

    <label class="setting-row checkbox-row">
      <span class="setting-label">Sound alerts</span>
      <input type="checkbox" id="setSoundAlerts" />
    </label>

    <label class="setting-row">
      <span class="setting-label">Alert tone <span class="setting-value" id="valTonePitch"></span></span>
      <input type="range" id="setTonePitch" min="500" max="2500" step="25" />
      <span class="setting-help">Pitch of the over-limit tone. Release the slider to preview it.</span>
    </label>

    <label class="setting-row">
      <span class="setting-label">Look-ahead <span class="setting-value" id="valLookahead"></span></span>
      <input type="range" id="setLookahead" min="0" max="6" step="0.5" />
      <span class="setting-help">How far ahead to estimate your speed while accelerating, to make up for GPS lag. 0 s uses the measured speed only.</span>
    </label>

    <label class="setting-row checkbox-row">
      <span class="setting-label">Keep screen awake</span>
      <input type="checkbox" id="setWakeLock" />
    </label>

    <label class="setting-row checkbox-row">
      <span class="setting-label">Test mode</span>
      <input type="checkbox" id="setTestMode" />
    </label>
    <span class="setting-help test-mode-help">Drive the speed with up/down buttons instead of GPS, so you can check the warnings without a car.</span>

    <div class="settings-actions">
      <button id="settingsCloseBtn" class="btn primary">Done</button>
    </div>

    <p class="build-version" id="buildVersion"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
